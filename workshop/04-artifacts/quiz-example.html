<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 상식 퀴즈 (완성 예시)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; font-family: "Noto Sans KR", system-ui, sans-serif; background: #f5f7fb; color: #1e2a4a; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .bar { height: 8px; background: #e2e7f0; border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .bar span { display: block; height: 100%; background: #ea580c; width: 0; transition: width .3s; }
  .card { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 6px 20px rgba(30,42,74,.07); }
  .opt { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px; border: 1px solid #cfd6e4; border-radius: 8px; background: #fff; font-size: 1rem; cursor: pointer; }
  .opt.correct { border-color: #16a34a; background: #ecfdf3; }
  .opt.wrong { border-color: #dc2626; background: #fef2f2; }
  .explain { margin-top: 12px; color: #4b5873; }
  .next { margin-top: 16px; padding: 11px 20px; border: 0; border-radius: 8px; background: #1e2a4a; color: #fff; cursor: pointer; font-size: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><span id="bar"></span></div>
  <div class="card" id="card"></div>
</div>
<script>
const quiz = [
  { q: "생성형 AI의 '환각(Hallucination)'이란?", o: ["사실과 다른 내용을 그럴듯하게 생성하는 현상", "인터넷 속도가 느려지는 현상", "AI가 이미지를 흐리게 만드는 현상", "AI가 대답을 거부하는 현상"], a: 0, e: "AI가 근거 없이 그럴듯한 답을 만드는 것을 환각이라고 합니다." },
  { q: "좋은 프롬프트의 5요소에 포함되지 않는 것은?", o: ["역할", "맥락", "형식", "글자 색상"], a: 3, e: "5요소는 역할·목적·맥락·형식·제약조건입니다." },
  { q: "Claude에서 문서와 지침을 고정해 두는 전용 공간은?", o: ["Artifacts", "Projects", "Canvas", "Terminal"], a: 1, e: "Projects에 기준 문서와 지침을 등록하면 반복 작업이 쉬워집니다." },
  { q: "개인정보가 담긴 문서를 AI에 올리기 전에 해야 할 일은?", o: ["파일 이름 바꾸기", "마스킹(비식별화)", "PDF로 변환", "글꼴 변경"], a: 1, e: "이름·연락처 등 민감 정보는 가린 뒤 업로드해야 합니다." },
  { q: "웹페이지에서 '동작(클릭·계산)'을 담당하는 기술은?", o: ["HTML", "CSS", "JavaScript", "PDF"], a: 2, e: "HTML은 구조, CSS는 디자인, JavaScript는 동작을 담당합니다." }
];
let i = 0, score = 0;
const card = document.getElementById("card"), bar = document.getElementById("bar");
function render() {
  bar.style.width = (i / quiz.length * 100) + "%";
  if (i === quiz.length) {
    card.innerHTML = `<h2>퀴즈 완료!</h2><p>총점: <b>${score} / ${quiz.length}</b></p><button class="next" onclick="i=0;score=0;render()">다시 풀기</button>`;
    return;
  }
  const item = quiz[i];
  card.innerHTML = `<p>Q${i + 1}. ${item.q}</p>` +
    item.o.map((t, k) => `<button class="opt" data-k="${k}">${k + 1}. ${t}</button>`).join("") +
    `<p class="explain" id="ex"></p>`;
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(b));
}
function answer(btn) {
  const item = quiz[i], k = Number(btn.dataset.k);
  card.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (Number(b.dataset.k) === item.a) b.classList.add("correct"); });
  if (k === item.a) score++; else btn.classList.add("wrong");
  document.getElementById("ex").textContent = (k === item.a ? "정답! " : "오답. ") + item.e;
  const n = document.createElement("button"); n.className = "next";
  n.textContent = i === quiz.length - 1 ? "결과 보기" : "다음 문제";
  n.onclick = () => { i++; render(); }; card.appendChild(n);
}
render();
</script>
</body>
</html>
